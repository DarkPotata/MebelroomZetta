services:
  backend:
    build:
      context: ./zetta-backend
      dockerfile: Dockerfile
    container_name: zetta-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-zetta_super_secret}
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/dev.db}
    volumes:
      - sqlite_data:/app/data
    networks:
      - zetta-net

  frontend:
    build:
      context: ./Zetta
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: zetta-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - zetta-net

volumes:
  sqlite_data:

networks:
  zetta-net:
    driver: bridge